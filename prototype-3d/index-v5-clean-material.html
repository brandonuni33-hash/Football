<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>STP — Terrain Clean Material V1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0f0c;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4f1e8}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:14px;top:14px;z-index:10;background:rgba(7,11,9,.76);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:12px 14px;max-width:min(390px,calc(100vw - 28px));box-shadow:0 8px 28px rgba(0,0,0,.22)}.title{font-size:13px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;margin-bottom:6px}.sub{font-size:12px;line-height:1.42;color:#c9cec9}.badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.08);color:#f0d58a}.controls{position:fixed;right:14px;bottom:14px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 28px)}button{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(7,11,9,.80);color:#f4f1e8;border-radius:12px;padding:10px 12px;font-weight:750;font-size:12px;backdrop-filter:blur(8px)}button:active{transform:scale(.98)}.status{position:fixed;left:14px;bottom:14px;z-index:10;font-size:11px;color:#bdc7bf;background:rgba(7,11,9,.66);padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="title">STP — TERRAIN CLEAN MATERIAL</div>
  <div class="sub">Un seul Plane 105 × 68 m. Toutes les lignes sont dans l’Albedo. Le relief de gazon vient uniquement de la Normal Map. La brillance est contrôlée par une Roughness Map.</div>
  <span class="badge">1 plane · UV 0–1 · Albedo + Normal + Roughness</span>
</div>
<div class="controls">
  <button id="matchView">Vue match</button>
  <button id="materialView">Vue matière</button>
  <button id="topView">Vue dessus</button>
  <button id="toggleNormal">Normal ON</button>
</div>
<div class="status" id="status">Glisse avec le doigt pour tourner la caméra.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js';

const FIELD_W = 68;
const FIELD_L = 105;
const TEX_W = 1024;
const TEX_H = Math.round(TEX_W * FIELD_L / FIELD_W);

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1510);
scene.fog = new THREE.Fog(0x0d1510, 88, 200);

const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, 0.1, 320);
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.03;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9e5dc,0x1b241d,1.9));
const sun = new THREE.DirectionalLight(0xfff2d3,3.1);
sun.position.set(-32,46,26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-75;sun.shadow.camera.right=75;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
scene.add(sun);

function meterToPxX(m){ return (m / FIELD_W) * TEX_W; }
function meterToPxY(m){ return (m / FIELD_L) * TEX_H; }
function xFromCenter(m){ return TEX_W/2 + meterToPxX(m); }
function yFromCenter(m){ return TEX_H/2 + meterToPxY(m); }

function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(27061996);

// ------------------------------------------------------------
// BASE COLOR / ALBEDO : gazon + bandes de tonte + lignes blanches
// ------------------------------------------------------------
function makeAlbedo(){
  const c=document.createElement('canvas');c.width=TEX_W;c.height=TEX_H;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  const img=ctx.createImageData(TEX_W,TEX_H),d=img.data;
  const stripeMeters=7.5;
  const stripePx=meterToPxY(stripeMeters);

  for(let y=0;y<TEX_H;y++){
    const stripe=(Math.floor(y/stripePx)%2)===0;
    for(let x=0;x<TEX_W;x++){
      const i=(y*TEX_W+x)*4;
      const macro=Math.sin(x*.018)+Math.sin(y*.013)+Math.sin((x+y)*.006);
      const micro=(rnd()-.5)*18;
      const speck=(rnd()>.986)?(rnd()-.5)*22:0;
      const light=stripe?4.5:-4.5;
      d[i]   = Math.round(34 + light*.40 + macro*1.2 + micro*.15 + speck*.2);
      d[i+1] = Math.round(104 + light + macro*2.0 + micro*.60 + speck);
      d[i+2] = Math.round(43 + light*.35 + macro*1.0 + micro*.18 + speck*.25);
      d[i+3] = 255;
    }
  }
  ctx.putImageData(img,0,0);

  // Very short grass fibres painted into albedo: dense, subtle, no visible tufts.
  ctx.globalAlpha=.12;
  ctx.lineWidth=1;
  for(let i=0;i<90000;i++){
    const x=rnd()*TEX_W,y=rnd()*TEX_H;
    const l=.5+rnd()*1.7;
    ctx.strokeStyle=rnd()>.5?'#9ab86f':'#173b21';
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(rnd()-.5)*.5,y-l);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Pitch markings directly painted into the albedo map.
  ctx.strokeStyle='#f4f2e9';
  ctx.fillStyle='#f4f2e9';
  ctx.lineWidth=Math.max(2,meterToPxX(.12));
  ctx.lineCap='butt';
  ctx.lineJoin='miter';

  const left=xFromCenter(-FIELD_W/2), right=xFromCenter(FIELD_W/2);
  const top=yFromCenter(-FIELD_L/2), bottom=yFromCenter(FIELD_L/2);
  ctx.strokeRect(left,top,right-left,bottom-top);

  // Halfway line (across the width).
  ctx.beginPath();ctx.moveTo(left,yFromCenter(0));ctx.lineTo(right,yFromCenter(0));ctx.stroke();

  // Centre circle and spot.
  ctx.beginPath();ctx.ellipse(xFromCenter(0),yFromCenter(0),meterToPxX(9.15),meterToPxY(9.15),0,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(xFromCenter(0),yFromCenter(0),Math.max(2,meterToPxX(.14)),0,Math.PI*2);ctx.fill();

  function drawPenalty(zSign){
    const goalY=yFromCenter(zSign*FIELD_L/2);
    const innerY=yFromCenter(zSign*(FIELD_L/2-16.5));
    const sixY=yFromCenter(zSign*(FIELD_L/2-5.5));
    const boxL=xFromCenter(-20.16),boxR=xFromCenter(20.16);
    const sixL=xFromCenter(-9.16),sixR=xFromCenter(9.16);

    ctx.beginPath();ctx.moveTo(boxL,goalY);ctx.lineTo(boxL,innerY);ctx.lineTo(boxR,innerY);ctx.lineTo(boxR,goalY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sixL,goalY);ctx.lineTo(sixL,sixY);ctx.lineTo(sixR,sixY);ctx.lineTo(sixR,goalY);ctx.stroke();

    const spotY=yFromCenter(zSign*(FIELD_L/2-11));
    ctx.beginPath();ctx.arc(xFromCenter(0),spotY,Math.max(2,meterToPxX(.14)),0,Math.PI*2);ctx.fill();

    // Penalty arc: only the portion outside the box.
    const cx=xFromCenter(0), cy=spotY, rx=meterToPxX(9.15), ry=meterToPxY(9.15);
    ctx.save();
    const clipY = zSign>0 ? innerY : innerY;
    ctx.beginPath();
    if(zSign>0) ctx.rect(0,0,TEX_W,innerY);
    else ctx.rect(0,innerY,TEX_W,TEX_H-innerY);
    ctx.clip();
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  drawPenalty(1);drawPenalty(-1);

  // Corner arcs.
  const crx=meterToPxX(1),cry=meterToPxY(1);
  const corners=[[left,top,0,.5*Math.PI],[right,top,.5*Math.PI,Math.PI],[right,bottom,Math.PI,1.5*Math.PI],[left,bottom,1.5*Math.PI,Math.PI*2]];
  for(const [cx,cy,a0,a1] of corners){ctx.beginPath();ctx.ellipse(cx,cy,crx,cry,0,a0,a1);ctx.stroke();}

  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// ------------------------------------------------------------
// NORMAL MAP : virtual micro-relief only, no extra polygons.
// ------------------------------------------------------------
function makeNormalMap(){
  const w=512,h=Math.round(512*FIELD_L/FIELD_W);
  const height=new Float32Array(w*h);
  const rand=mulberry32(11081996);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=y*w+x;
      const n=(rand()-.5)*.72;
      const fine=Math.sin(x*.47+y*.13)*.16+Math.sin(x*.11-y*.39)*.12;
      const grain=Math.sin((x+y)*1.7)*.04;
      height[i]=n+fine+grain;
    }
  }
  const data=new Uint8Array(w*h*4);
  const strength=1.75;
  const get=(x,y)=>height[Math.max(0,Math.min(h-1,y))*w+Math.max(0,Math.min(w-1,x))];
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const dx=(get(x+1,y)-get(x-1,y))*strength;
      const dy=(get(x,y+1)-get(x,y-1))*strength;
      let nx=-dx,ny=-dy,nz=1;
      const l=Math.hypot(nx,ny,nz);nx/=l;ny/=l;nz/=l;
      const i=(y*w+x)*4;
      data[i]=Math.round((nx*.5+.5)*255);
      data[i+1]=Math.round((ny*.5+.5)*255);
      data[i+2]=Math.round((nz*.5+.5)*255);
      data[i+3]=255;
    }
  }
  const tex=new THREE.DataTexture(data,w,h,THREE.RGBAFormat);
  tex.colorSpace=THREE.NoColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(6,9.25);
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  tex.needsUpdate=true;
  return tex;
}

// ------------------------------------------------------------
// ROUGHNESS MAP : mostly dry/matte, very small local variation.
// Three.js reads the green channel for roughness.
// ------------------------------------------------------------
function makeRoughnessMap(){
  const w=512,h=Math.round(512*FIELD_L/FIELD_W);
  const data=new Uint8Array(w*h*4);
  const rand=mulberry32(18082026);
  for(let y=0;y<h;y++){
    const stripe=(Math.floor(y/(h/14))%2)===0;
    for(let x=0;x<w;x++){
      const variation=(rand()-.5)*20 + (stripe?4:-4) + Math.sin((x+y)*.031)*3;
      const v=Math.max(205,Math.min(248,228+variation));
      const i=(y*w+x)*4;data[i]=v;data[i+1]=v;data[i+2]=v;data[i+3]=255;
    }
  }
  const tex=new THREE.DataTexture(data,w,h,THREE.RGBAFormat);
  tex.colorSpace=THREE.NoColorSpace;
  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
  tex.needsUpdate=true;
  return tex;
}

const albedo=makeAlbedo();
const normalMap=makeNormalMap();
const roughnessMap=makeRoughnessMap();

// Single geometry. PlaneGeometry already carries a clean 0–1 UV set over the full rectangle.
const geometry=new THREE.PlaneGeometry(FIELD_W,FIELD_L,1,1);
geometry.rotateX(-Math.PI/2);
const material=new THREE.MeshStandardMaterial({
  map:albedo,
  normalMap,
  normalScale:new THREE.Vector2(.32,.32),
  roughnessMap,
  roughness:1.0,
  metalness:0
});
const pitch=new THREE.Mesh(geometry,material);
pitch.receiveShadow=true;
scene.add(pitch);

// Simple dark surround, only to make the edge of the field readable.
const surroundGeo=new THREE.PlaneGeometry(FIELD_W+10,FIELD_L+10);surroundGeo.rotateX(-Math.PI/2);
const surround=new THREE.Mesh(surroundGeo,new THREE.MeshStandardMaterial({color:0x101713,roughness:1,metalness:0}));
surround.position.y=-.018;scene.add(surround);

const target=new THREE.Vector3(0,0,0);
let yaw=0,pitchAngle=.63,distance=77;
function updateCamera(){
  const cp=Math.cos(pitchAngle),sp=Math.sin(pitchAngle);
  camera.position.set(target.x+Math.sin(yaw)*distance*cp,target.y+distance*sp,target.z+Math.cos(yaw)*distance*cp);
  camera.lookAt(target);
}
function setView(mode){
  if(mode==='match'){yaw=0;pitchAngle=.63;distance=77;target.set(0,0,0);}
  else if(mode==='material'){yaw=.28;pitchAngle=.16;distance=17;target.set(0,.04,3);}
  else{yaw=0;pitchAngle=1.36;distance=87;target.set(0,0,0);}
  updateCamera();
}
setView('match');

document.getElementById('matchView').onclick=()=>setView('match');
document.getElementById('materialView').onclick=()=>setView('material');
document.getElementById('topView').onclick=()=>setView('top');
let normalOn=true;
document.getElementById('toggleNormal').onclick=(e)=>{
  normalOn=!normalOn;
  material.normalScale.set(normalOn?.32:0,normalOn?.32:0);
  e.currentTarget.textContent=normalOn?'Normal ON':'Normal OFF';
  document.getElementById('status').textContent=normalOn?'Normal Map activée : micro-relief virtuel du gazon.':'Normal Map coupée : comparaison avec le sol parfaitement lisse.';
};

let dragging=false,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.005;pitchAngle=THREE.MathUtils.clamp(pitchAngle+dy*.004,.08,1.46);updateCamera()});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{distance=THREE.MathUtils.clamp(distance+e.deltaY*.03,11,135);updateCamera()},{passive:true});

function animate(){renderer.render(scene,camera);requestAnimationFrame(animate)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
