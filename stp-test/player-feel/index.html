<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>STP — Player Feel Lab V0.7</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="game-screen">
    <header class="hudbar">
      <strong>STP · PLAYER FEEL LAB V0.7</strong>
      <span id="hud-detail">Pieds plus fins · contrôle lent du corps · angle caméra réglable</span>
      <button id="restart" type="button">RESTART</button>
    </header>
    <section class="arena">
      <canvas id="game" width="1000" height="540" aria-label="Player Feel Lab Street to Pro"></canvas>
      <div class="camera-tuner">
        <label for="camera-angle">ANGLE CAMÉRA <output id="camera-angle-value">28°</output></label>
        <input id="camera-angle" type="range" min="0" max="45" value="28" step="1" />
      </div>
      <div class="controls">
        <div id="move-joystick" class="joystick move"><div id="move-stick" class="stick amber"></div></div>
        <button id="rapid" class="action rapid-action" type="button">RAPIDE</button>
      </div>
      <aside class="legend">
        <b>À TESTER · V0.7</b>
        <span>1. pieds plus petits et moins ronds</span>
        <span>2. stick léger + direction latérale/arrière : le corps garde son orientation</span>
        <span>3. pousse davantage le stick : le joueur se retourne normalement</span>
      </aside>
    </section>
  </main>
  <script type="module" src="./playerFeelLabV07.js"></script>
</body>
</html>
