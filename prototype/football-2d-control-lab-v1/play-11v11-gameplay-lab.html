<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>STP — 11v11 Gameplay Lab</title>
  <link rel="stylesheet" href="./styles-11v11-gameplay-lab.css" />
</head>
<body>
  <main id="game-screen" class="game-screen">
    <header class="hudbar">
      <strong>STP · GAMEPLAY LAB 11v11</strong>
      <span id="hud-detail">Bloc équipe · triangles · zone/individuel</span>
      <div class="hud-actions">
        <button id="restart" type="button">RESTART</button>
        <button id="toggle-settings" type="button">RÉGLAGES</button>
      </div>
    </header>

    <section class="arena">
      <canvas id="game" width="1000" height="540" aria-label="Laboratoire gameplay Street to Pro 11 contre 11"></canvas>

      <section id="settings" class="settings collapsed">
        <div class="setting-row">
          <label for="zoom">ZOOM</label><output id="zoom-value">0.90</output>
          <input id="zoom" type="range" min="75" max="180" value="90" step="1" />
        </div>
        <div class="setting-row">
          <label for="angle">ANGLE 3/4</label><output id="angle-value">60</output>
          <input id="angle" type="range" min="0" max="60" value="60" step="1" />
        </div>
        <p>Vision 120° · tête 180° · corps 200°/s · caméra ballon</p>
      </section>

      <div class="controls">
        <div id="move-joystick" class="joystick move"><div id="move-stick" class="stick amber"></div></div>
        <div class="right-cluster">
          <button id="primary" class="action primary-action" type="button">TIR</button>
          <button id="secondary" class="action secondary-action" type="button">PASSE</button>
          <button id="tertiary" class="action tertiary-action" type="button">PROT.</button>
          <button id="rapid" class="action rapid-action" type="button">RAPIDE</button>
          <div id="control-joystick" class="joystick control" data-mode="scan"><div id="control-stick" class="stick"></div></div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./play-11v11-gameplay-lab.js"></script>
</body>
</html>
