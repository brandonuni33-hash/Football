<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Career Simulator - V2</title>
    <!-- Chargement de Tailwind CSS pour un design propre et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    
    <!-- Conteneur principal injecté dynamiquement par le module UI -->
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-8"></div>

    <!-- Point d'entrée principal en module ES6 -->
    <script type="module" src="./main.js"></script>
</body>
</html>
