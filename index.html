<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Career Simulator</title>
    <!-- Tailwind CSS pour le design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    
    <!-- Conteneur principal de l'application -->
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-8"></div>

    <!-- TOUTE LA LOGIQUE DU JEU EST ICI -->
    <script>
        // ==========================================
        // 1. CONSTANTES & DONNÉES STATIQUES
        // ==========================================
        const POSITIONS = [
            { id: 'BU', name: 'Buteur' }, { id: 'AD', name: 'Ailier Droit' }, { id: 'AG', name: 'Ailier Gauche' },
            { id: 'MOC', name: 'Milieu Offensif' }, { id: 'MC', name: 'Milieu Central' }, { id: 'MDC', name: 'Milieu Défensif' },
            { id: 'DD', name: 'Défenseur Droit' }, { id: 'DG', name: 'Défenseur Gauche' }, { id: 'DC', name: 'Défenseur Central' },
            { id: 'GK', name: 'Gardien' }
        ];

        const ORIGINS = {
            ACADEMY: { id: 'ACADEMY', name: 'Centre de Formation', trait: 'Classique', modifiers: { mental: 10, tactique: 10, ovrBase: 0 } },
            AMATEUR: { id: 'AMATEUR', name: 'Club Amateur', trait: 'Acharné', modifiers: { physique: 10, tactique: -10, ovrBase: 0 } },
            FUTSAL: { id: 'FUTSAL', name: 'Futsal', trait: 'Dribbleur Fin', modifiers: { technique: 10, dribble: 10, ovrBase: 0 } },
            LATE_BLOOMER: { id: 'LATE_BLOOMER', name: 'Débutant Tardif', trait: 'Poulain Brut', modifiers: { physique: 5, ovrBase: -5 } },
            STREET: { id: 'STREET', name: 'Street Football', trait: 'Instinct 1v1', modifiers: { dribble: 10, tactique: -5, ovrBase: 0 } },
            ATHLETE: { id: 'ATHLETE', name: 'Athlète Polyvalent', trait: 'Moteur Hybride', modifiers: { vitesse: 15, puissance: 15, ovrBase: 0 } }
        };

        const STARTING_CLUBS = [
            { id: 'FCGB', name: 'Bordeaux', league: 'Ligue 2', style: 'Reconstruction' },
            { id: 'FCN', name: 'Nantes', league: 'Ligue 1', style: 'Défensif / Contre' },
            { id: 'LOR', name: 'Lormont', league: 'Régional', style: 'Amateur Rugueux' },
            { id: 'PAU', name: 'Pau FC', league: 'Ligue 2', style: 'Bloc Médian' },
            { id: 'SCB', name: 'Bastia', league: 'Ligue 2', style: 'Chaudron / Pression' },
            { id: 'EAG', name: 'Guingamp', league: 'Ligue 2', style: 'Transition Rapide' }
        ];

        // ==========================================
        // 2. GESTIONNAIRE D'ÉTAT (STATE MANAGER)
        // ==========================================
        const STORAGE_KEY = 'fc_career_save_v1.0';
        let state = {
            isCreated: false,
            player: null,
            career: { age: 14, week: 1, season: 1, balance: 0, salary: 0, fame: 0 }
        };

        const StateManager = {
            load: () => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) state = JSON.parse(saved);
                } catch (e) { console.error("Erreur de sauvegarde", e); }
            },
            save: () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state)),
            get: () => state,
            update: (updates) => {
                state = { ...state, ...updates };
                StateManager.save();
                window.dispatchEvent(new Event('stateChanged'));
            }
        };

        // ==========================================
        // 3. LOGIQUE METIER (PLAYER)
        // ==========================================
        const PlayerLogic = {
            generateRandomName: () => {
                const firstNames = ['Lucas', 'Hugo', 'Enzo', 'Kylian', 'Theo', 'Rayan'];
                const lastNames = ['Martin', 'Bernard', 'Dubois', 'Thomas', 'Robert', 'Richard'];
                const r = (arr) => arr[Math.floor(Math.random() * arr.length)];
                return `${r(firstNames)} ${r(lastNames)}`;
            },
            createPlayerProfile: (formData) => {
                const originData = ORIGINS[formData.originId];
                let stats = { technique: 50, physique: 50, mental: 50, tactique: 50, vitesse: 50, puissance: 50, dribble: 50 };
                
                if (originData && originData.modifiers) {
                    for (const [key, value] of Object.entries(originData.modifiers)) {
                        if (stats[key] !== undefined) stats[key] += value;
                    }
                }

                const values = Object.values(stats);
                const ovr = Math.round((values.reduce((a, b) => a + b, 0) / values.length) + (originData.modifiers.ovrBase || 0));

                return {
                    id: Date.now(),
                    firstName: formData.firstName,
                    lastName: formData.lastName,
                    height: formData.height,
                    weight: formData.weight,
                    position: formData.position,
                    origin: formData.originId,
                    trait: originData.trait,
                    currentClub: formData.startingClub,
                    stats: stats,
                    ovr: ovr,
                    relations: { coach: 50, dressingRoom: 50, arrogance: 20, discipline: 80 }
                };
            }
        };

        // ==========================================
        // 4. MOTEUR D'INTERFACE (UI RENDERER)
        // ==========================================
        const UIRenderer = {
            init: () => {
                const app = document.getElementById('app');
                UIRenderer.render(app);
                window.addEventListener('stateChanged', () => UIRenderer.render(app));
            },
            render: (container) => {
                const currentState = StateManager.get();
                container.innerHTML = '';
                if (!currentState.isCreated) {
                    container.innerHTML = UIRenderer.templates.creationForm();
                    UIRenderer.bindCreationEvents();
                } else {
                    container.innerHTML = UIRenderer.templates.dashboard(currentState);
                    UIRenderer.bindDashboardEvents();
                }
            },
            templates: {
                creationForm: () => `
                    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl fade-in border border-gray-700">
                        <h1 class="text-3xl font-bold mb-6 text-blue-400">Création de Joueur</h1>
                        <form id="creation-form" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-b border-gray-700 pb-4">
                                <div><label class="block text-sm text-gray-400 mb-1">Prénom</label><input type="text" id="c_first" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white" required></div>
                                <div><label class="block text-sm text-gray-400 mb-1">Nom</label><input type="text" id="c_last" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white" required></div>
                                <div class="md:col-span-2"><button type="button" id="btn-random-name" class="text-sm text-blue-400">Générer un nom aléatoire</button></div>
                            </div>
                            <div class="grid grid-cols-2 gap-6 border-b border-gray-700 pb-4">
                                <div><label class="block text-sm text-gray-400 mb-1">Taille (<span id="height-val">175</span> cm)</label><input type="range" id="c_height" min="160" max="210" value="175" class="w-full"></div>
                                <div><label class="block text-sm text-gray-400 mb-1">Poids (<span id="weight-val">70</span> kg)</label><input type="range" id="c_weight" min="55" max="110" value="70" class="w-full"></div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-sm text-gray-400 mb-1">Poste</label><select id="c_position" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white">${POSITIONS.map(p => `<option value="${p.id}">${p.name} (${p.id})</option>`).join('')}</select></div>
                                <div><label class="block text-sm text-gray-400 mb-1">Origine</label><select id="c_origin" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white">${Object.values(ORIGINS).map(o => `<option value="${o.id}">${o.name}</option>`).join('')}</select></div>
                                <div class="md:col-span-2"><label class="block text-sm text-gray-400 mb-1">Club de Départ</label><select id="c_startClub" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white">${STARTING_CLUBS.map(c => `<option value="${c.id}">${c.name} (${c.league})</option>`).join('')}</select></div>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg mt-6">Lancer la Carrière</button>
                        </form>
                    </div>
                `,
                dashboard: (s) => `
                    <div class="fade-in">
                        <header class="bg-gray-800 p-6 rounded-xl shadow-lg mb-6 border border-gray-700 flex justify-between items-center">
                            <div>
                                <h1 class="text-2xl font-bold text-white">${s.player.firstName} ${s.player.lastName}</h1>
                                <p class="text-blue-400 font-medium">${s.player.position} | ${s.career.age} ans | OVR: ${s.player.ovr}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-sm text-gray-400">Club Actuel</p>
                                <p class="font-bold text-lg text-white">${STARTING_CLUBS.find(c => c.id === s.player.currentClub)?.name || 'Agent Libre'}</p>
                            </div>
                        </header>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                                <h2 class="text-lg font-bold mb-4 text-gray-200 border-b border-gray-700 pb-2">Attributs</h2>
                                <ul class="space-y-2 text-sm">
                                    <li class="flex justify-between"><span>Technique</span> <span>${s.player.stats.technique}</span></li>
                                    <li class="flex justify-between"><span>Physique</span> <span>${s.player.stats.physique}</span></li>
                                    <li class="flex justify-between"><span>Mental</span> <span>${s.player.stats.mental}</span></li>
                                </ul>
                            </div>
                            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex flex-col justify-center items-center">
                                <p class="text-gray-400 mb-2">Semaine ${s.career.week} / Saison ${s.career.season}</p>
                                <button id="btn-advance" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-lg">Avancer la semaine</button>
                            </div>
                        </div>
                    </div>
                `
            },
            bindCreationEvents: () => {
                document.getElementById('c_height')?.addEventListener('input', (e) => document.getElementById('height-val').innerText = e.target.value);
                document.getElementById('c_weight')?.addEventListener('input', (e) => document.getElementById('weight-val').innerText = e.target.value);
                document.getElementById('btn-random-name')?.addEventListener('click', () => {
                    const name = PlayerLogic.generateRandomName().split(' ');
                    document.getElementById('c_first').value = name[0];
                    document.getElementById('c_last').value = name[1];
                });
                document.getElementById('creation-form')?.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const newPlayer = PlayerLogic.createPlayerProfile({
                        firstName: document.getElementById('c_first').value,
                        lastName: document.getElementById('c_last').value,
                        height: parseInt(document.getElementById('c_height').value),
                        weight: parseInt(document.getElementById('c_weight').value),
                        position: document.getElementById('c_position').value,
                        originId: document.getElementById('c_origin').value,
                        startingClub: document.getElementById('c_startClub').value,
                    });
                    StateManager.update({ isCreated: true, player: newPlayer });
                });
            },
            bindDashboardEvents: () => {
                document.getElementById('btn-advance')?.addEventListener('click', () => {
                    const s = StateManager.get();
                    let newWeek = s.career.week + 1;
                    let newAge = s.career.age;
                    let newSeason = s.career.season;
                    if (newWeek > 52) { newWeek = 1; newAge += 1; newSeason += 1; }
                    StateManager.update({ career: { ...s.career, week: newWeek, age: newAge, season: newSeason } });
                });
            }
        };

        // ==========================================
        // 5. INITIALISATION DU JEU
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            StateManager.load();
            UIRenderer.init();
        });
    </script>
</body>
</html>
