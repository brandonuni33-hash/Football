name: PR Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Diff check
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Syntax check
        run: find application domain ui -name '*.js' -print0 | xargs -0 -n1 node --check
