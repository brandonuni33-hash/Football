name: Career Simulation

on:
  workflow_dispatch:
  push:
    paths:
      - 'careerSimulation.js'
      - 'player.js'
      - 'potentialSystem.js'
      - 'progression.js'
      - 'domain/**/*.js'
      - '.github/workflows/career-simulation.yml'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 1000 careers
        run: |
          node --input-type=module -e "import { simulateCareers, printSimulationReport } from './careerSimulation.js'; printSimulationReport(simulateCareers(1000, { maxAge: 34 }));"
