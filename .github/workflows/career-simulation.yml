name: Career Simulation

on:
  workflow_dispatch:
  push:
    paths:
      - 'careerSimulation.js'
      - 'player.js'
      - 'potentialSystem.js'

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run 1000 careers
        run: node --input-type=module -e "import { simulateCareers, printSimulationReport } from './careerSimulation.js'; printSimulationReport(simulateCareers(1000, { maxAge: 34 }));"
