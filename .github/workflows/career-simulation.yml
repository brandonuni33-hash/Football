name: Architecture Checks

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - 'package.json'
      - '.github/workflows/career-simulation.yml'

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Run architecture audit
        run: node scripts/checkArchitecture.mjs
