<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0e10"><title>STP Player Feel — Mission 2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e10;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:4;text-shadow:0 2px 6px #000;pointer-events:none}#title{font-weight:800;letter-spacing:.04em;font-size:15px}#readout{margin-top:4px;font-size:13px;font-variant-numeric:tabular-nums;color:#ecece4}#hint{margin-top:3px;font-size:12px;color:#c8c9c5}#stick{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:168px;height:168px;z-index:5;touch-action:none}#base{position:absolute;left:20px;top:20px;width:128px;height:128px;border-radius:50%;background:rgba(16,19,21,.58);border:2px solid rgba(240,240,232,.38);box-shadow:inset 0 0 22px rgba(0,0,0,.25)}#knob{position:absolute;width:54px;height:54px;left:57px;top:57px;border-radius:50%;background:rgba(244,244,236,.82);box-shadow:0 4px 16px rgba(0,0,0,.35);transform:translate(0,0)}#rotate{display:none;position:fixed;inset:0;z-index:20;background:rgba(5,7,8,.94);align-items:center;justify-content:center;text-align:center;padding:32px;font-weight:700}@media(orientation:portrait){#rotate{display:flex}}#badge{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));font-size:11px;color:#969b9d;z-index:4;pointer-events:none;text-align:right}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="title">PLAYER FEEL — MISSION 2</div><div id="readout">ARRÊT · 0.00 → 0.00 m/s</div><div id="hint">Même joystick que M1 · accélération + décélération seulement</div></div><div id="stick"><div id="base"></div><div id="knob"></div></div><div id="badge">accel 12.0 · decel 18.0 m/s²<br>lent 1.80 · normal 4.60 m/s</div><div id="rotate">Tourne le téléphone en paysage pour tester le Player Feel.</div><script>(()=>{'use strict';const DEADZONE=.12,SLOW_INPUT=.40,SLOW_SPEED=1.8,NORMAL_SPEED=4.6,ACCELERATION=12,DECELERATION=18,STICK_RADIUS=64;const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),readout=document.getElementById('readout');let dpr=1,w=0,h=0,pointerId=null,last=performance.now();const input={x:0,y:0},player={x:0,y:0,heading:-Math.PI/2,speed:0,targetSpeed:0,lastX:0,lastY:-1};function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}function speedForMagnitude(m){m=Math.max(0,Math.min(1,m));if(m<=DEADZONE)return 0;const usable=1-DEADZONE,normalized=(m-DEADZONE)/usable,slowPoint=(SLOW_INPUT-DEADZONE)/usable;if(normalized<=slowPoint)return SLOW_SPEED*(normalized/slowPoint);const t=(normalized-slowPoint)/(1-slowPoint);return SLOW_SPEED+(NORMAL_SPEED-SLOW_SPEED)*t}function moveToward(c,t,d){if(c<t)return Math.min(c+d,t);if(c>t)return Math.max(c-d,t);return t}function setStick(x,y){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy;const len=Math.hypot(dx,dy);if(len>STICK_RADIUS){dx=dx/len*STICK_RADIUS;dy=dy/len*STICK_RADIUS}input.x=dx/STICK_RADIUS;input.y=dy/STICK_RADIUS;knob.style.transform=`translate(${dx}px,${dy}px)`}function release(){pointerId=null;input.x=input.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{if(pointerId!==null)return;pointerId=e.pointerId;stick.setPointerCapture(pointerId);setStick(e.clientX,e.clientY);e.preventDefault()});stick.addEventListener('pointermove',e=>{if(e.pointerId!==pointerId)return;setStick(e.clientX,e.clientY);e.preventDefault()});stick.addEventListener('pointerup',e=>{if(e.pointerId===pointerId)release()});stick.addEventListener('pointercancel',e=>{if(e.pointerId===pointerId)release()});function step(dt){const mag=Math.min(1,Math.hypot(input.x,input.y));player.targetSpeed=speedForMagnitude(mag);const rate=player.targetSpeed>player.speed?ACCELERATION:DECELERATION;player.speed=moveToward(player.speed,player.targetSpeed,rate*dt);if(mag>DEADZONE){player.lastX=input.x/mag;player.lastY=input.y/mag;player.heading=Math.atan2(player.lastY,player.lastX)}if(player.speed>0){player.x+=player.lastX*player.speed*dt;player.y+=player.lastY*player.speed*dt}const state=player.speed<.01?'ARRÊT':player.speed<=SLOW_SPEED?'LENT':'NORMAL';readout.textContent=`${state} · input ${mag.toFixed(2)} · ${player.speed.toFixed(2)} → ${player.targetSpeed.toFixed(2)} m/s`}function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#202428';ctx.fillRect(0,0,w,h);const ppm=34,cx=w/2,cy=h/2,cameraX=player.x,cameraY=player.y;ctx.lineWidth=1;ctx.strokeStyle='rgba(180,185,186,.12)';const cols=Math.ceil(w/ppm/2)+2,rows=Math.ceil(h/ppm/2)+2,ox=(((-cameraX)%1)+1)%1,oy=(((-cameraY)%1)+1)%1;for(let i=-cols;i<=cols;i++){const x=cx+(i+ox)*ppm;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let i=-rows;i<=rows;i++){const y=cy+(i+oy)*ppm;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='rgba(229,183,72,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-w,cy);ctx.lineTo(cx+w,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy-h);ctx.lineTo(cx,cy+h);ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(player.heading+Math.PI/2);ctx.fillStyle='#e3e0d5';ctx.beginPath();ctx.ellipse(0,0,15,19,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e7b748';ctx.fillRect(-3.5,-28,7,16);ctx.restore()}function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;step(dt);draw();requestAnimationFrame(frame)}addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame)})();</script></body></html>
