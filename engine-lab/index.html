<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>STP Engine Lab — Editor Shell v0.1</title>
<style>
:root{--bg:#15171a;--panel:#1d2024;--panel2:#25292e;--line:#343941;--text:#e8e9eb;--muted:#9da4ad;--accent:#f0c969;--blue:#5ba7ff;--green:#70d58a;--red:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px}
button,input{font:inherit}.app{display:grid;grid-template-rows:42px 1fr 26px;height:100%}.toolbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#202328;border-bottom:1px solid var(--line);white-space:nowrap;overflow:auto}.brand{font-weight:800;letter-spacing:.08em;margin-right:8px}.toolbar button{border:1px solid #414751;background:#2a2e34;color:var(--text);border-radius:5px;padding:6px 9px}.toolbar button.active{background:#4b3e20;border-color:#8d7130;color:#ffe3a1}.toolbar .spacer{flex:1}.metric{color:var(--muted);padding:0 4px}.metric b{color:var(--text);font-weight:650}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;min-height:0}.panel{background:var(--panel);min-height:0;overflow:auto}.hierarchy{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.panel-title{position:sticky;top:0;z-index:3;display:flex;align-items:center;height:34px;padding:0 10px;background:#23272c;border-bottom:1px solid var(--line);font-weight:750}.tree{padding:6px 0}.tree-row{display:flex;align-items:center;gap:6px;height:26px;padding-right:8px;cursor:pointer;user-select:none;color:#ccd0d5}.tree-row:hover{background:#282d33}.tree-row.selected{background:#35404d;color:#fff}.tree-icon{width:14px;text-align:center;color:#97a0aa}.tree-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewport{position:relative;min-width:0;min-height:0;background:#101214}.viewport canvas{display:block;width:100%;height:100%;touch-action:none}.viewport-head{position:absolute;top:8px;left:8px;z-index:5;display:flex;gap:5px}.viewport-head button{border:1px solid #49505a;background:rgba(27,30,34,.9);color:#e4e6e8;border-radius:5px;padding:5px 8px}.viewport-head button.active{border-color:#d2aa4d;color:#ffe09a}.tip{position:absolute;left:8px;bottom:8px;z-index:5;padding:6px 8px;border:1px solid rgba(255,255,255,.1);border-radius:5px;background:rgba(20,22,25,.82);color:#aeb5bd}.section{border-bottom:1px solid var(--line)}.section-head{padding:9px 10px 7px;font-weight:750;color:#d8dce0;background:#202429}.section-body{padding:9px 10px 12px}.kv{display:grid;grid-template-columns:82px 1fr;gap:7px;align-items:center;margin:6px 0}.label{color:#a8afb7}.value{color:#e8eaed;overflow-wrap:anywhere}.xyz{display:grid;grid-template-columns:18px 1fr 18px 1fr 18px 1fr;gap:4px;align-items:center;margin:6px 0}.xyz span{font-weight:750;text-align:center}.x{color:var(--red)}.y{color:var(--green)}.z{color:var(--blue)}input[type=number],input[type=text]{width:100%;min-width:0;background:#14171a;color:#f0f1f2;border:1px solid #3b4149;border-radius:4px;padding:5px 6px}input:focus{outline:1px solid #8b743c;border-color:#8b743c}.small-row{display:flex;gap:6px;flex-wrap:wrap}.small-row button{border:1px solid #414750;background:#292e34;color:#e6e7e8;border-radius:4px;padding:5px 7px}.danger{color:#ff9b9b!important}.status{display:flex;align-items:center;gap:16px;padding:0 8px;background:#202328;border-top:1px solid var(--line);color:#9da4ad;overflow:hidden;white-space:nowrap}.status .ok{color:#8ed39b}.status .play{color:#f1cd75}.empty{padding:14px 10px;color:#8f969e;line-height:1.45}.badge{display:inline-block;padding:2px 5px;border-radius:4px;background:#30363d;color:#b7bec6;font-size:10px}
@media(max-width:900px){.workspace{grid-template-columns:170px minmax(0,1fr) 230px}.kv{grid-template-columns:65px 1fr}.brand{display:none}.metric.hide-sm{display:none}}
@media(max-width:650px){.workspace{grid-template-columns:130px minmax(0,1fr) 180px}.panel-title{padding:0 7px}.section-body{padding:7px}.xyz{grid-template-columns:14px 1fr}.xyz span:nth-of-type(n+2),.xyz input:nth-of-type(n+2){display:none}.tip{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}</script>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="brand">STP ENGINE LAB v0.1</div>
    <button id="playBtn">▶ Play</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="addCubeBtn">＋ Cube</button>
    <button id="addEmptyBtn">＋ Empty</button>
    <button id="resetBtn">Reset scène</button>
    <div class="spacer"></div>
    <div class="metric">FPS <b id="fps">0</b></div>
    <div class="metric hide-sm">Δt <b id="dt">0.00 ms</b></div>
    <div class="metric hide-sm">Frame <b id="frame">0</b></div>
  </div>

  <div class="workspace">
    <aside class="panel hierarchy">
      <div class="panel-title">Scène</div>
      <div class="tree" id="tree"></div>
    </aside>

    <main class="viewport" id="viewport">
      <div class="viewport-head">
        <button id="moveMode" class="active">W Déplacer</button>
        <button id="rotateMode">E Rotation</button>
        <button id="scaleMode">R Échelle</button>
        <button id="focusBtn">F Focus</button>
      </div>
      <div class="tip">Clique un objet → modifie Position / Rotation / Échelle dans l’Inspecteur. ZQSD agit en mode Play.</div>
    </main>

    <aside class="panel inspector">
      <div class="panel-title">Inspecteur</div>
      <div id="inspectorBody"></div>
    </aside>
  </div>

  <div class="status">
    <span id="engineState" class="ok">● EDIT</span>
    <span id="graphicsApi">GPU : initialisation…</span>
    <span>Input : <b id="inputState">—</b></span>
    <span>Game Loop : processInput() → update() → render()</span>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ============================================================
// STP ENGINE LAB — minimal editor/runtime architecture
// Input -> Time -> Update -> Render, plus Scene Graph + Inspector.
// ============================================================

const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a1e);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.appendChild(renderer.domElement);

const gl = renderer.getContext();
document.getElementById('graphicsApi').textContent = `GPU : ${gl.getParameter(gl.VERSION)}`;

// Editor camera (not part of the game scene graph).
const editorCamera = new THREE.PerspectiveCamera(50,1,0.05,500);
editorCamera.position.set(7,6,9);
editorCamera.lookAt(0,1,0);
const orbit = new OrbitControls(editorCamera,renderer.domElement);
orbit.enableDamping = true;
orbit.target.set(0,1,0);

// GameObject root = ancestor of the future ECS/hierarchy layer.
const root = new THREE.Group();
root.name = 'World';
root.userData.editorType = 'SceneRoot';
scene.add(root);

// Reference grid is editor-only.
const grid = new THREE.GridHelper(30,30,0x5d6269,0x34383e);
grid.position.y = 0;
scene.add(grid);
scene.add(new THREE.AxesHelper(2));

// Runtime game camera object.
const gameCamera = new THREE.PerspectiveCamera(50,16/9,.1,300);
gameCamera.name = 'Camera3D';
gameCamera.position.set(0,5,8);
gameCamera.rotation.x = THREE.MathUtils.degToRad(-25);
gameCamera.userData.editorType = 'Camera';
root.add(gameCamera);
const cameraHelper = new THREE.CameraHelper(gameCamera); cameraHelper.userData.editorOnly=true; scene.add(cameraHelper);

// Light object.
const hemi = new THREE.HemisphereLight(0xcfe2ff,0x252017,1.4); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff,2.4);
sun.name='DirectionalLight';sun.position.set(4,8,3);sun.castShadow=true;sun.userData.editorType='Light';root.add(sun);

// First Triangle: manual vertex buffer + shaders (minimal GPU pipeline).
const triangleObject = new THREE.Group();
triangleObject.name='FirstTriangle';triangleObject.position.set(0,1.2,0);triangleObject.userData.editorType='GameObject';root.add(triangleObject);
const positions = new Float32Array([-1,-.65,0, 1,-.65,0, 0,1,0]);
const colors = new Float32Array([1,.32,.25, .25,.75,1, .95,.78,.25]);
const triGeometry = new THREE.BufferGeometry();
triGeometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
triGeometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
const triMaterial = new THREE.ShaderMaterial({
  vertexShader:`attribute vec3 color; varying vec3 vColor; void main(){vColor=color;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float; varying vec3 vColor; void main(){gl_FragColor=vec4(vColor,1.0);}`,
  side:THREE.DoubleSide
});
const triangleMesh = new THREE.Mesh(triGeometry,triMaterial);
triangleMesh.name='TriangleMesh';triangleMesh.userData.editorType='Mesh';triangleObject.add(triangleMesh);

// Small ground reference, not the saved football pitch.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(8,5),new THREE.MeshStandardMaterial({color:0x273128,roughness:1,metalness:0}));
ground.name='GroundReference';ground.rotation.x=-Math.PI/2;ground.position.y=.001;ground.receiveShadow=true;ground.userData.editorType='Mesh';root.add(ground);

// Transform gizmo, like Unity/Godot editor handles.
const transform = new TransformControls(editorCamera,renderer.domElement);
transform.setMode('translate');
scene.add(transform.getHelper());
transform.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);
transform.addEventListener('objectChange',()=>{ syncInspectorFromObject(); cameraHelper.update(); });

let selected = triangleObject;
transform.attach(selected);

// ---------------- Scene Hierarchy ----------------
const treeEl = document.getElementById('tree');
function iconFor(o){ if(o===root)return'◈'; if(o.isCamera)return'▣'; if(o.isLight)return'☀'; if(o.isMesh)return'◆'; return'◇'; }
function rebuildTree(){
  treeEl.innerHTML='';
  function row(o,depth){
    if(o.userData.editorOnly)return;
    const el=document.createElement('div');el.className='tree-row'+(o===selected?' selected':'');el.style.paddingLeft=`${8+depth*14}px`;
    el.innerHTML=`<span class="tree-icon">${iconFor(o)}</span><span class="tree-name">${o.name||o.type}</span>`;
    el.onclick=()=>selectObject(o);treeEl.appendChild(el);
    for(const c of o.children)row(c,depth+1);
  }
  row(root,0);
}

// ---------------- Inspector ----------------
const inspectorBody=document.getElementById('inspectorBody');
function numberField(id,v){return `<input id="${id}" type="number" step="0.01" value="${Number(v).toFixed(3)}">`;}
function renderInspector(){
  if(!selected){inspectorBody.innerHTML='<div class="empty">Aucun objet sélectionné.</div>';return;}
  const r=selected.rotation;
  inspectorBody.innerHTML=`
    <div class="section"><div class="section-head">Objet</div><div class="section-body">
      <div class="kv"><div class="label">Nom</div><input id="objName" type="text" value="${selected.name||selected.type}"></div>
      <div class="kv"><div class="label">Type</div><div class="value"><span class="badge">${selected.userData.editorType||selected.type}</span></div></div>
      <div class="kv"><div class="label">Parent</div><div class="value">${selected.parent?.name||'—'}</div></div>
    </div></div>
    <div class="section"><div class="section-head">Transform</div><div class="section-body">
      <div class="label">Position</div><div class="xyz"><span class="x">X</span>${numberField('px',selected.position.x)}<span class="y">Y</span>${numberField('py',selected.position.y)}<span class="z">Z</span>${numberField('pz',selected.position.z)}</div>
      <div class="label">Rotation °</div><div class="xyz"><span class="x">X</span>${numberField('rx',THREE.MathUtils.radToDeg(r.x))}<span class="y">Y</span>${numberField('ry',THREE.MathUtils.radToDeg(r.y))}<span class="z">Z</span>${numberField('rz',THREE.MathUtils.radToDeg(r.z))}</div>
      <div class="label">Échelle</div><div class="xyz"><span class="x">X</span>${numberField('sx',selected.scale.x)}<span class="y">Y</span>${numberField('sy',selected.scale.y)}<span class="z">Z</span>${numberField('sz',selected.scale.z)}</div>
      <div class="small-row" style="margin-top:9px"><button id="zeroPos">Position 0</button><button id="zeroRot">Rotation 0</button><button id="oneScale">Échelle 1</button></div>
    </div></div>
    <div class="section"><div class="section-head">Données moteur</div><div class="section-body">
      <div class="kv"><div class="label">UUID</div><div class="value">${selected.uuid.slice(0,13)}…</div></div>
      <div class="kv"><div class="label">Visible</div><div class="value">${selected.visible?'Oui':'Non'}</div></div>
      <div class="small-row"><button id="focusObject">Focus</button>${selected!==root?'<button id="deleteObject" class="danger">Supprimer</button>':''}</div>
    </div></div>`;
  bindInspector();
}
function bindInspector(){
  const q=id=>document.getElementById(id); if(!selected)return;
  q('objName').onchange=e=>{selected.name=e.target.value||selected.type;rebuildTree();};
  const pos=['px','py','pz'],rot=['rx','ry','rz'],scl=['sx','sy','sz'];
  pos.forEach((id,i)=>q(id).oninput=e=>{selected.position.setComponent(i,Number(e.target.value)||0);cameraHelper.update();});
  rot.forEach((id,i)=>q(id).oninput=e=>{const vals=[selected.rotation.x,selected.rotation.y,selected.rotation.z];vals[i]=THREE.MathUtils.degToRad(Number(e.target.value)||0);selected.rotation.set(vals[0],vals[1],vals[2]);cameraHelper.update();});
  scl.forEach((id,i)=>q(id).oninput=e=>{selected.scale.setComponent(i,Number(e.target.value)||0);});
  q('zeroPos').onclick=()=>{selected.position.set(0,0,0);syncInspectorFromObject();};
  q('zeroRot').onclick=()=>{selected.rotation.set(0,0,0);syncInspectorFromObject();};
  q('oneScale').onclick=()=>{selected.scale.set(1,1,1);syncInspectorFromObject();};
  q('focusObject').onclick=focusSelected;
  const del=q('deleteObject');if(del)del.onclick=()=>{ if(selected.parent){selected.parent.remove(selected);transform.detach();selected=null;rebuildTree();renderInspector();} };
}
function syncInspectorFromObject(){
  if(!selected||!document.getElementById('px'))return;
  const set=(id,v)=>document.getElementById(id).value=Number(v).toFixed(3);
  set('px',selected.position.x);set('py',selected.position.y);set('pz',selected.position.z);
  set('rx',THREE.MathUtils.radToDeg(selected.rotation.x));set('ry',THREE.MathUtils.radToDeg(selected.rotation.y));set('rz',THREE.MathUtils.radToDeg(selected.rotation.z));
  set('sx',selected.scale.x);set('sy',selected.scale.y);set('sz',selected.scale.z);
}
function selectObject(o){selected=o; if(o===root)transform.detach(); else transform.attach(o); rebuildTree();renderInspector();}
function focusSelected(){if(!selected)return;const p=new THREE.Vector3();selected.getWorldPosition(p);orbit.target.copy(p);const d=Math.max(3,selected.scale.length()*2.5);editorCamera.position.copy(p).add(new THREE.Vector3(d*.7,d*.55,d));orbit.update();}

// Canvas selection.
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
  if(transform.dragging)return;
  const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,editorCamera);const hits=raycaster.intersectObjects(root.children,true).filter(h=>!h.object.userData.editorOnly);
  if(hits.length){let o=hits[0].object;while(o.parent&&o.parent!==root&&o.parent!==triangleObject)o=o.parent;if(o.parent===triangleObject)o=triangleObject;selectObject(o);}
});

// ---------------- Input System ----------------
const keys=new Set();const actions=new Set();
const keyToAction={KeyZ:'MOVE_FORWARD',ArrowUp:'MOVE_FORWARD',KeyS:'MOVE_BACK',ArrowDown:'MOVE_BACK',KeyQ:'MOVE_LEFT',ArrowLeft:'MOVE_LEFT',KeyD:'MOVE_RIGHT',ArrowRight:'MOVE_RIGHT'};
addEventListener('keydown',e=>{keys.add(e.code);if(keyToAction[e.code]){actions.add(keyToAction[e.code]);e.preventDefault();}if(e.code==='KeyW')setTransformMode('translate');if(e.code==='KeyE')setTransformMode('rotate');if(e.code==='KeyR')setTransformMode('scale');if(e.code==='KeyF')focusSelected();});
addEventListener('keyup',e=>{keys.delete(e.code);if(keyToAction[e.code])actions.delete(keyToAction[e.code]);});
function processInput(){document.getElementById('inputState').textContent=actions.size?[...actions].join(', '):'—';}

// ---------------- Time Manager + Update ----------------
let engineRunning=false,paused=false,frame=0,last=performance.now(),fpsAcc=0,fpsFrames=0,lastFps=0;
function update(dt){
  if(!engineRunning||paused)return;
  const speed=2.8;
  if(actions.has('MOVE_FORWARD'))triangleObject.position.z-=speed*dt;
  if(actions.has('MOVE_BACK'))triangleObject.position.z+=speed*dt;
  if(actions.has('MOVE_LEFT'))triangleObject.position.x-=speed*dt;
  if(actions.has('MOVE_RIGHT'))triangleObject.position.x+=speed*dt;
  triangleMesh.rotation.y+=.35*dt;
  if(selected===triangleObject)syncInspectorFromObject();
}
function render(){orbit.update();cameraHelper.update();renderer.render(scene,editorCamera);}

// Main Game Loop.
function mainLoop(now){
  requestAnimationFrame(mainLoop);
  const dt=Math.min((now-last)/1000,.05);last=now;frame++;
  processInput();update(dt);render();
  fpsAcc+=dt;fpsFrames++;
  if(fpsAcc>=.35){lastFps=Math.round(fpsFrames/fpsAcc);fpsAcc=0;fpsFrames=0;document.getElementById('fps').textContent=lastFps;}
  document.getElementById('dt').textContent=(dt*1000).toFixed(2)+' ms';document.getElementById('frame').textContent=frame;
}
requestAnimationFrame(mainLoop);

// ---------------- Editor Commands ----------------
function setTransformMode(mode){transform.setMode(mode);['moveMode','rotateMode','scaleMode'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(mode==='translate'?'moveMode':mode==='rotate'?'rotateMode':'scaleMode').classList.add('active');}
document.getElementById('moveMode').onclick=()=>setTransformMode('translate');document.getElementById('rotateMode').onclick=()=>setTransformMode('rotate');document.getElementById('scaleMode').onclick=()=>setTransformMode('scale');document.getElementById('focusBtn').onclick=focusSelected;
document.getElementById('playBtn').onclick=()=>{engineRunning=true;paused=false;document.getElementById('engineState').textContent='● PLAY';document.getElementById('engineState').className='play';};
document.getElementById('pauseBtn').onclick=()=>{paused=!paused;document.getElementById('engineState').textContent=paused?'● PAUSE':(engineRunning?'● PLAY':'● EDIT');};
document.getElementById('addCubeBtn').onclick=()=>{const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x7ea3d8,roughness:.75}));m.name='Cube';m.position.set(0,.5,0);m.userData.editorType='Mesh';root.add(m);selectObject(m);};
document.getElementById('addEmptyBtn').onclick=()=>{const g=new THREE.Group();g.name='GameObject';g.userData.editorType='GameObject';root.add(g);selectObject(g);};
document.getElementById('resetBtn').onclick=()=>{triangleObject.position.set(0,1.2,0);triangleObject.rotation.set(0,0,0);triangleObject.scale.set(1,1,1);engineRunning=false;paused=false;actions.clear();document.getElementById('engineState').textContent='● EDIT';document.getElementById('engineState').className='ok';selectObject(triangleObject);focusSelected();};

function resize(){const r=viewport.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);editorCamera.aspect=r.width/r.height;editorCamera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();rebuildTree();renderInspector();
</script>
</body>
</html>
