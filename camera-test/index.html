<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>STP — Camera Test</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#f5f5f2;touch-action:none}
body{position:fixed;inset:0}
#wrap{position:absolute;inset:0;background:#0a0d12}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.card{background:rgba(5,8,12,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:9px 11px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
#status{min-width:164px}
.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#b6a46d;font-weight:800}
#stateLabel{font-size:19px;font-weight:850;line-height:1.05;margin-top:2px}
#stateHint{font-size:11px;color:#a8afb9;margin-top:3px;max-width:180px}
#metrics{font-size:10px;line-height:1.45;color:#c9ced5;text-align:right}
#topBtns{display:flex;gap:7px;pointer-events:auto}
.iconBtn{border:1px solid rgba(255,255,255,.12);background:rgba(5,8,12,.78);color:white;border-radius:12px;height:40px;min-width:42px;padding:0 11px;font-weight:800}
#states{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 82px);display:flex;gap:6px;pointer-events:auto;max-width:calc(100vw - 24px);overflow-x:auto;padding:2px;scrollbar-width:none}
#states::-webkit-scrollbar{display:none}
.stateBtn{white-space:nowrap;border:1px solid rgba(255,255,255,.14);background:rgba(5,8,12,.7);color:#d8dde3;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:850;letter-spacing:.04em}
.stateBtn.active{background:#f1eee3;color:#12151a;border-color:#f1eee3}
#controls{position:absolute;inset:0;pointer-events:none}
#joyBase{position:absolute;left:max(22px,calc(env(safe-area-inset-left) + 14px));bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));width:118px;height:118px;border-radius:50%;background:rgba(8,11,16,.34);border:1px solid rgba(255,255,255,.16);pointer-events:auto;touch-action:none;backdrop-filter:blur(4px)}
#joyKnob{position:absolute;width:48px;height:48px;border-radius:50%;left:35px;top:35px;background:rgba(245,245,240,.78);box-shadow:0 4px 16px rgba(0,0,0,.25)}
#shoot{position:absolute;right:max(24px,calc(env(safe-area-inset-right) + 14px));bottom:max(34px,calc(env(safe-area-inset-bottom) + 28px));width:88px;height:88px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(150,117,47,.82);color:#fff;font-size:16px;font-weight:900;letter-spacing:.08em;pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.28)}
#debug{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(132px,calc(env(safe-area-inset-bottom) + 122px));width:min(270px,calc(100vw - 24px));max-height:46vh;overflow:auto;pointer-events:auto;display:none}
#debug.open{display:block}
#debug h3{margin:0 0 8px;font-size:13px}
.row{display:grid;grid-template-columns:74px 1fr 42px;align-items:center;gap:7px;margin:7px 0;font-size:10px;color:#c8cdd4}
.row input{width:100%;accent-color:#cbb67a}
.val{text-align:right;color:white;font-variant-numeric:tabular-nums}
#reset{width:100%;margin-top:5px;border:1px solid rgba(255,255,255,.14);background:#151922;color:white;border-radius:9px;padding:8px;font-size:11px;font-weight:800}
#help{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));font-size:9px;color:rgba(255,255,255,.55);pointer-events:none;white-space:nowrap}
@media(max-height:650px){#states{top:72px}.card{padding:7px 9px}#stateHint{display:none}#joyBase{width:100px;height:100px}#joyKnob{left:31px;top:31px;width:38px;height:38px}#shoot{width:74px;height:74px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
  <div id="status" class="card"><div class="kicker">STP CAMERA PROTOTYPE</div><div id="stateLabel">NORMAL</div><div id="stateHint">Caméra broadcast stable, légère anticipation.</div></div>
  <div id="topBtns"><button class="iconBtn" id="debugBtn">RÉGLAGES</button></div>
</div>
<div id="states">
  <button class="stateBtn active" data-state="AUTO">AUTO</button>
  <button class="stateBtn" data-state="NORMAL">NORMAL</button>
  <button class="stateBtn" data-state="COUNTER_ATTACK">CONTRE</button>
  <button class="stateBtn" data-state="DANGER">DANGER</button>
  <button class="stateBtn" data-state="SHOT">FRAPPE</button>
</div>
<div id="controls">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="shoot">TIR</button>
</div>
<div id="debug" class="card">
  <h3>Réglages caméra en direct</h3>
  <div class="row"><span>Zoom</span><input id="zoomAdj" type="range" min="0.75" max="1.35" value="1" step="0.01"><span class="val" id="zoomVal">1.00</span></div>
  <div class="row"><span>Pivot max</span><input id="pivotAdj" type="range" min="0" max="15" value="15" step="1"><span class="val" id="pivotVal">15°</span></div>
  <div class="row"><span>Suivi</span><input id="followAdj" type="range" min="0.5" max="2.5" value="1" step="0.05"><span class="val" id="followVal">1.00</span></div>
  <div class="row"><span>Anticip.</span><input id="aheadAdj" type="range" min="0" max="0.35" value="0.15" step="0.01"><span class="val" id="aheadVal">0.15</span></div>
  <div class="row"><span>Transition</span><input id="transitionAdj" type="range" min="0.2" max="1.4" value="0.65" step="0.05"><span class="val" id="transitionVal">0.65</span></div>
  <button id="reset">Réinitialiser les valeurs STP v1</button>
</div>
<div id="help">Pouce gauche : déplacement · TIR : frappe · teste surtout en paysage</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
let W=0,H=0,last=performance.now();
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const FIELD={w:105,h:68};
const player={x:27,y:34,vx:0,vy:0};
const ball={x:29,y:34,vx:0,vy:0,shot:false};
const opponents=[{x:48,y:21},{x:55,y:34},{x:47,y:48},{x:73,y:27},{x:76,y:43}];
const mates=[{x:38,y:17},{x:43,y:52},{x:61,y:18},{x:65,y:49}];
const camera={x:32,y:34,zoom:1,pivot:5,targetZoom:1,targetPivot:5};
let mode='AUTO',effective='NORMAL';
let joy={x:0,y:0,active:false};
let shotTimer=0;
const defaults={zoom:1,pivot:15,follow:1,ahead:.15,transition:.65};
const tune={...defaults};
const presets={
 NORMAL:{zoom:1.00,pivot:5,follow:1.00,hint:'Caméra broadcast stable, légère anticipation.'},
 COUNTER_ATTACK:{zoom:.90,pivot:7,follow:1.35,hint:'Dézoom pour révéler l’espace devant la course.'},
 DANGER:{zoom:1.11,pivot:11,follow:1.15,hint:'Rapprochement progressif près de la zone dangereuse.'},
 SHOT:{zoom:1.16,pivot:15,follow:1.75,hint:'Le focus glisse du joueur vers la trajectoire du ballon.'}
};

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function expLerp(a,b,speed,dt){return lerp(a,b,1-Math.exp(-speed*dt))}
function chooseState(){
 if(mode!=='AUTO') return mode;
 if(ball.shot) return 'SHOT';
 if(player.x>78) return 'DANGER';
 if(player.vx>9 && player.x>38) return 'COUNTER_ATTACK';
 return 'NORMAL';
}
function worldToScreen(x,y){
 const scale=Math.min(W/58,H/38)*camera.zoom;
 let dx=x-camera.x,dy=y-camera.y;
 const a=(camera.pivot*Math.PI/180)*.32;
 const rx=dx*Math.cos(a)-dy*Math.sin(a), ry=dx*Math.sin(a)+dy*Math.cos(a);
 const sx=W/2+rx*scale;
 const sy=H/2+ry*scale*.62 + rx*scale*.035;
 return [sx,sy];
}
function poly(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function line(a,b,color='rgba(255,255,255,.65)',width=1){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function circleWorld(x,y,r,fill,stroke){const p=worldToScreen(x,y),scale=Math.min(W/58,H/38)*camera.zoom;ctx.beginPath();ctx.ellipse(p[0],p[1],r*scale,r*scale*.62,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawPitch(){
 ctx.fillStyle='#09110d';ctx.fillRect(0,0,W,H);
 const corners=[[0,0],[105,0],[105,68],[0,68]].map(p=>worldToScreen(...p));
 poly(corners,'#315d3b','rgba(255,255,255,.75)',1.4);
 for(let x=0;x<105;x+=10.5){const a=worldToScreen(x,0),b=worldToScreen(x+10.5,0),c=worldToScreen(x+10.5,68),d=worldToScreen(x,68);poly([a,b,c,d],(Math.floor(x/10.5)%2)?'rgba(255,255,255,.018)':'rgba(0,0,0,.035)')}
 line(worldToScreen(52.5,0),worldToScreen(52.5,68));circleWorld(52.5,34,9.15,null,'rgba(255,255,255,.62)');circleWorld(52.5,34,.25,'rgba(255,255,255,.8)');
 [[0,13.84,16.5,54.16],[88.5,13.84,105,54.16]].forEach(r=>poly([[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]].map(p=>worldToScreen(...p)),null,'rgba(255,255,255,.62)'));
 [[0,24.84,5.5,43.16],[99.5,24.84,105,43.16]].forEach(r=>poly([[r[0],r[1]],[r[2],r[1]],[r[2],r[3]],[r[0],r[3]]].map(p=>worldToScreen(...p)),null,'rgba(255,255,255,.62)'));
 }
function drawPerson(o,color,ring=false){const p=worldToScreen(o.x,o.y),s=clamp(Math.min(W/390,H/700),.75,1.15);ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=6;ctx.beginPath();ctx.ellipse(p[0],p[1]+8*s,10*s,4*s,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.22)';ctx.fill();ctx.shadowBlur=0;if(ring){ctx.beginPath();ctx.arc(p[0],p[1],12*s,0,Math.PI*2);ctx.strokeStyle='#e5cb7b';ctx.lineWidth=2;ctx.stroke()}ctx.beginPath();ctx.arc(p[0],p[1],7*s,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function drawBall(){const p=worldToScreen(ball.x,ball.y),r=clamp(Math.min(W/390,H/700)*4.2,3.3,5);ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fillStyle='#f4f1e9';ctx.fill();ctx.strokeStyle='#17191d';ctx.lineWidth=1;ctx.stroke()}
function draw(){drawPitch();mates.forEach(o=>drawPerson(o,'#d9d6cc'));opponents.forEach(o=>drawPerson(o,'#8c3030'));drawPerson(player,'#1f6db0',true);drawBall();
 const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'rgba(0,0,0,.22)');grad.addColorStop(.28,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,.12)');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
}
function update(dt){
 const speed=12.5;player.vx=joy.x*speed;player.vy=joy.y*speed;player.x=clamp(player.x+player.vx*dt,2,103);player.y=clamp(player.y+player.vy*dt,2,66);
 if(ball.shot){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.985,dt*60);ball.vy*=Math.pow(.985,dt*60);shotTimer-=dt;if(shotTimer<=0||ball.x>104||ball.y<1||ball.y>67){ball.shot=false;ball.x=player.x+2;ball.y=player.y}}
 else {const lead=2.1;ball.x=expLerp(ball.x,player.x+lead,10,dt);ball.y=expLerp(ball.y,player.y,10,dt)}
 effective=chooseState();const p=presets[effective];
 const stateZoom=p.zoom*tune.zoom;camera.targetZoom=stateZoom;camera.targetPivot=clamp(p.pivot,0,tune.pivot);
 const transitionSpeed=4.5/Math.max(.2,tune.transition);camera.zoom=expLerp(camera.zoom,camera.targetZoom,transitionSpeed,dt);camera.pivot=expLerp(camera.pivot,camera.targetPivot,transitionSpeed,dt);
 const focusBall=effective==='SHOT'?.78:.25;const focusX=lerp(player.x,ball.x,focusBall);const focusY=lerp(player.y,ball.y,focusBall);
 const direction=Math.abs(player.vx)>.6?Math.sign(player.vx):1;let ahead=direction*(FIELD.w*tune.ahead*.18);if(effective==='COUNTER_ATTACK')ahead*=1.45;if(effective==='DANGER')ahead*=.8;
 const targetX=clamp(focusX+ahead,13,92),targetY=clamp(focusY,14,54);const fs=p.follow*tune.follow;
 camera.x=expLerp(camera.x,targetX,2.3*fs,dt);camera.y=expLerp(camera.y,targetY,2.0*fs,dt);
 document.getElementById('stateLabel').textContent=effective;document.getElementById('stateHint').textContent=p.hint;
}
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

const base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob');
function setJoy(clientX,clientY){const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,max=r.width*.31,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len),px=dx*k,py=dy*k;joy.x=clamp(dx/max,-1,1);joy.y=clamp(dy/max,-1,1);knob.style.transform=`translate(${px}px,${py}px)`}
base.addEventListener('pointerdown',e=>{joy.active=true;base.setPointerCapture(e.pointerId);setJoy(e.clientX,e.clientY)});base.addEventListener('pointermove',e=>{if(joy.active)setJoy(e.clientX,e.clientY)});function release(){joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}base.addEventListener('pointerup',release);base.addEventListener('pointercancel',release);

document.getElementById('shoot').addEventListener('pointerdown',()=>{if(ball.shot)return;ball.shot=true;shotTimer=1.6;const dx=104-ball.x,dy=34-ball.y,len=Math.hypot(dx,dy)||1;ball.vx=dx/len*42;ball.vy=dy/len*42});

document.querySelectorAll('.stateBtn').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.state;document.querySelectorAll('.stateBtn').forEach(b=>b.classList.toggle('active',b===btn))}));
document.getElementById('debugBtn').addEventListener('click',()=>document.getElementById('debug').classList.toggle('open'));
const binds=[['zoomAdj','zoom','zoomVal',v=>(+v).toFixed(2)],['pivotAdj','pivot','pivotVal',v=>`${Math.round(v)}°`],['followAdj','follow','followVal',v=>(+v).toFixed(2)],['aheadAdj','ahead','aheadVal',v=>(+v).toFixed(2)],['transitionAdj','transition','transitionVal',v=>(+v).toFixed(2)]];
binds.forEach(([id,key,valId,fmt])=>{const input=document.getElementById(id),out=document.getElementById(valId);input.addEventListener('input',()=>{tune[key]=+input.value;out.textContent=fmt(input.value)})});
function applyDefaults(){Object.assign(tune,defaults);binds.forEach(([id,key,valId,fmt])=>{const i=document.getElementById(id);i.value=tune[key];document.getElementById(valId).textContent=fmt(tune[key])})}
document.getElementById('reset').addEventListener('click',applyDefaults);applyDefaults();
</script>
</body>
</html>
